# asana-progression: verify, e2e, then deploy to CapRover (https://asana.jannikarndt.de).
#
# verify builds dist/ (version.json = {build, …}, a content hash over dist/ and the server
# files); deploy ships exactly that dist/ with the server in a tarball and waits until
# /version serves the same build.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # started by dependabot-merge.yml after it merges

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling a deploy half way.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build: ${{ steps.id.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run verify # check, test, contract + server tests, build
      - id: id
        run: echo "build=$(node -p 'require("./dist/version.json").build')" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    needs: [verify, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: node scripts/deploy-tar.mjs deploy.tar
      - name: Deploy to CapRover
        env:
          CAPROVER_URL: https://captain.timpanini.com
          CAPROVER_APP: ${{ secrets.CAPROVER_APP }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
        # Exact CLI version. The token only as an env var. Every other value as a flag and stdin
        # closed: with a value missing the CLI prompts, crashes on the missing TTY and exits 0.
        run: |
          if [ -z "$CAPROVER_APP" ] || [ -z "$CAPROVER_APP_TOKEN" ]; then
            echo "::error::Set the CAPROVER_APP and CAPROVER_APP_TOKEN repository secrets"
            exit 1
          fi
          npx --yes caprover@2.4.4 deploy -u "$CAPROVER_URL" -a "$CAPROVER_APP" -t deploy.tar < /dev/null
      # The CLI can report success without deploying anything, and CapRover keeps serving the
      # old build when the new one fails to build or boot. /version is the real check.
      - name: Confirm the new build is live
        env:
          APP_URL: ${{ vars.APP_URL }}
          want: ${{ needs.verify.outputs.build }}
        run: |
          base="${APP_URL:-https://asana.jannikarndt.de}"
          url="${base%/}/version"
          got=""; code=""
          for i in $(seq 1 60); do
            body="$(curl -sS --max-time 10 -w '\n%{http_code}' "$url?t=$(date +%s)" || true)"
            code="${body##*$'\n'}"
            got="$(printf '%s' "${body%$'\n'*}" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).build)}catch{}})')"
            if [ "$got" = "$want" ]; then echo "LIVE: $got"; exit 0; fi
            echo "attempt $i: HTTP $code, build ${got:-none}, want $want"
            sleep 10
          done
          echo "::error::$url never reported build $want (last: HTTP $code, build ${got:-none}). Read the log: npm run logs."
          exit 1
