# GitHub Pages, built by Actions (Settings -> Pages -> Source: "GitHub Actions").
# Live: https://jannikarndt.github.io/asana-progression/
#
# verify (check, tests, build) and e2e (Playwright) both gate the deploy. The build
# writes dist/version.json = {build, version, builtAt}; after deploying, the last
# step waits until the live site serves that same `build` (scripts/stamp-build.mjs).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # started by dependabot-merge.yml after it merges

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build: ${{ steps.id.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify # check, test, deploy-contract tests, build
      - id: id
        run: echo "build=$(node -p 'require("./dist/version.json").build')" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    needs: [verify, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job may publish.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Confirm the new build is live
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          want: ${{ needs.verify.outputs.build }}
        run: |
          url="${PAGE_URL%/}/version.json"
          for i in $(seq 1 60); do
            got="$(curl -sS --max-time 10 "$url?t=$(date +%s)" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).build)}catch{}})' || true)"
            if [ "$got" = "$want" ]; then echo "LIVE: $got"; exit 0; fi
            echo "attempt $i: serving ${got:-nothing}, want $want"
            sleep 10
          done
          echo "::error::$url never reported build $want"
          exit 1
